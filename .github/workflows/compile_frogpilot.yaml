name: "Compile FrogPilot"
run-name: >-
  Compile ${{
    inputs.publish_frogpilot && (vars.BRANCH_RELEASE || 'FrogPilot')
    || inputs.publish_staging && (vars.BRANCH_STAGING || 'FrogPilot-Staging')
    || inputs.publish_testing && (vars.BRANCH_TESTING || 'FrogPilot-Testing')
    || inputs.publish_custom_branch
    || github.ref_name
  }}

on:
  workflow_dispatch:
    inputs:
      not_vetted:
        description: This branch is not vetted
        type: boolean
      publish_custom_branch:
        description: Custom branch name
        type: string
      publish_frogpilot:
        description: Push to FrogPilot
        type: boolean
      publish_staging:
        description: Push to FrogPilot-Staging
        type: boolean
      publish_testing:
        description: Push to FrogPilot-Testing
        type: boolean
      runner:
        default: c3
        description: Select runner
        options:
          - c3
          - c3x
        required: true
        type: choice

env:
  BRANCH_RELEASE: ${{ vars.BRANCH_RELEASE || 'FrogPilot' }}
  BRANCH_STAGING: ${{ vars.BRANCH_STAGING || 'FrogPilot-Staging' }}
  BRANCH_TESTING: ${{ vars.BRANCH_TESTING || 'FrogPilot-Testing' }}
  BUILD_DIR: /data/openpilot
  INPUT_CUSTOM_BRANCH: ${{ inputs.publish_custom_branch }}

permissions: {}

concurrency:
  group: compile-frogpilot-${{ github.ref_name }}

jobs:
  build_and_push:
    name: "Compile FrogPilot"
    runs-on:
      - self-hosted
      - ${{ inputs.runner }}
    timeout-minutes: 180
    concurrency:
      group: compile-frogpilot-runner-${{ inputs.runner }}
    steps:
      - name: "Validate inputs"
        run: |
          if [[ "${{ github.ref_type }}" != "branch" ]]; then
            echo "This workflow only supports branch dispatches."
            exit 1
          fi

          if [[ -z "${{ vars.GIT_NAME }}" || -z "${{ vars.GIT_EMAIL }}" ]]; then
            echo "Repository variables GIT_NAME and GIT_EMAIL must be set."
            exit 1
          fi

          if [[ -n "$INPUT_CUSTOM_BRANCH" ]]; then
            git check-ref-format --branch "$INPUT_CUSTOM_BRANCH" >/dev/null
          fi

      - name: "Set up build environment"
        run: |
          echo "[-] Setting up repo T=$SECONDS"
          sudo rm -rf "$BUILD_DIR"
          sudo mkdir -p "$BUILD_DIR"
          sudo chown -R "$(whoami):$(whoami)" "$BUILD_DIR"
          cd "$BUILD_DIR"

          git init
          git config user.name "${{ vars.GIT_NAME }}"
          git config user.email "${{ vars.GIT_EMAIL }}"
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --no-tags origin "${{ github.ref_name }}"
          git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"

      - name: "Prepare source"
        env:
          TMPDIR: /tmp
        run: |
          cd "$BUILD_DIR"

          if [[ ! -f "release/release_files.py" ]]; then
            echo "release/release_files.py not found — source branch may already be compiled."
            exit 1
          fi

          SOURCE_DIR=$(mktemp -d)
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "[-] copying files T=$SECONDS"
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec mv {} "$SOURCE_DIR/" \;

          cd "$SOURCE_DIR"
          python3 ./release/release_files.py | xargs -d '\n' cp -pR --parents -t "$BUILD_DIR/"

          cd "$BUILD_DIR"

          rm -f panda/board/obj/panda.bin.signed
          rm -f panda/board/obj/panda_h7.bin.signed

          rm -f ".github/update_date"
          if [[ "${{ inputs.publish_staging }}" == "true" ]]; then
            if git fetch --no-tags --depth=1 origin "$BRANCH_STAGING" 2>/dev/null; then
              if git show "FETCH_HEAD:.github/update_date" > ".github/update_date" 2>/dev/null; then
                echo "Restored .github/update_date from $BRANCH_STAGING."
              else
                rm -f ".github/update_date"
                echo "No .github/update_date found on $BRANCH_STAGING."
              fi
            else
              echo "Branch $BRANCH_STAGING not found, skipping update_date restore."
            fi
          fi

          rm -f not_vetted
          if [[ "${{ inputs.not_vetted }}" == "true" ]]; then
            touch not_vetted
          fi

      - name: "Build release"
        run: |
          cd "$BUILD_DIR"

          export UV_INSTALL_DIR=/data/uv
          export UV_CACHE_DIR=/data/uv-cache
          export PATH="/data/uv:$PATH"
          if ! command -v uv &>/dev/null; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          uv sync --frozen

          source .venv/bin/activate
          export PYTHONPATH="$BUILD_DIR"
          scons -j$(nproc) --minimal || scons -j$(( $(nproc) / 2 )) --minimal || scons -j1 --minimal
          scons -j$(nproc) panda/ || scons -j$(( $(nproc) / 2 )) panda/ || scons -j1 panda/

          submodules=$(git submodule status)
          if [[ -n "$submodules" ]]; then
            echo "submodules found:"
            echo "$submodules"
            exit 1
          fi

          find . -name '*.a' -delete
          find . -name '*.o' -delete
          find . -name '*.os' -delete
          find . -name '*.pyc' -delete
          find . -name '__pycache__' -delete
          find . -name 'moc_*' -delete

          git checkout frogpilot/third_party/
          find frogpilot/third_party/ -name '*Darwin*' -exec rm -r {} +
          find frogpilot/third_party/ -name '*x86*' -exec rm -r {} +

          find . -name '*.egg-info' -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.md' ! -name 'RELEASES.md' -delete
          find . \( -name '*_test.py' -o -name 'conftest.py' -o -name 'test_*.py' \) -delete
          find . \( -name '.dockerignore' -o -name '.editorconfig' -o -name '.pre-commit-config.yaml' -o -name '.pylintrc' -o -name 'Dockerfile*' \) -delete
          find . -mindepth 2 -type d -name '.github' -exec rm -rf {} + 2>/dev/null || true
          find . -type d \( -name 'docs' -o -name 'test' -o -name 'tests' \) -exec rm -rf {} + 2>/dev/null || true
          find selfdrive/modeld/models/ -name '*.onnx' -delete

          rm -rf \
            .github/ISSUE_TEMPLATE/ \
            .sconsign.dblite \
            .venv \
            Jenkinsfile \
            opendbc_repo/.uv-opendbc-only/ \
            release/ \
            selfdrive/debug/ \
            third_party/bootstrap/ \
            third_party/catch2/ \
            tinygrad_repo/examples/ \
            tinygrad_repo/extra/ \
            tools/cabana/ \
            tools/car_porting/ \
            tools/lib/ \
            tools/replay/ \
            tools/sim/
          rm -f \
            .github/labeler.yaml \
            .github/pull_request_template.md \
            uv.lock

          touch prebuilt

          git add --all --force
          git commit -m "Compile FrogPilot"

      - name: "Bundle compiled tree"
        run: |
          cd "$BUILD_DIR"

          bundle_dir="/tmp/frogpilot-compiled-${{ github.run_id }}-${{ github.run_attempt }}"
          rm -rf "$bundle_dir"
          mkdir -p "$bundle_dir"

          git bundle create "$bundle_dir/compiled_frogpilot.bundle" HEAD
          git rev-parse HEAD > "$bundle_dir/compiled_frogpilot.head"

      - name: "Upload compiled bundle"
        uses: actions/upload-artifact@v7
        with:
          name: compiled-frogpilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/frogpilot-compiled-${{ github.run_id }}-${{ github.run_attempt }}/compiled_frogpilot.bundle
            /tmp/frogpilot-compiled-${{ github.run_id }}-${{ github.run_attempt }}/compiled_frogpilot.head
          if-no-files-found: error
          retention-days: 1

      - name: "Cleanup"
        if: always()
        shell: "/usr/bin/bash --noprofile --norc -p -e -o pipefail {0}"
        env:
          BASH_ENV: /dev/null
          BUILD_DIR: /data/openpilot
          ENV: /dev/null
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          if [[ -n "${SOURCE_DIR:-}" && -d "$SOURCE_DIR" ]]; then
            source_dir_real=$(realpath -- "$SOURCE_DIR")
            source_parent=$(dirname -- "$source_dir_real")
            source_base=$(basename -- "$source_dir_real")
            if [[ "$source_parent" == "/tmp" && "$source_base" == tmp.* ]]; then
              sudo rm -rf --one-file-system -- "$source_dir_real"
            else
              echo "Skipping unexpected SOURCE_DIR: $SOURCE_DIR"
            fi
          fi

          sudo rm -rf --one-file-system -- /data/openpilot
          sudo rm -rf --one-file-system -- "/tmp/frogpilot-compiled-${{ github.run_id }}-${{ github.run_attempt }}"

  publish:
    name: "Publish FrogPilot"
    needs: build_and_push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Download compiled bundle"
        uses: actions/download-artifact@v8
        with:
          name: compiled-frogpilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/compiled-frogpilot

      - name: "Publish to target branches"
        shell: "/usr/bin/bash --noprofile --norc -p -e -o pipefail {0}"
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          ALL_PROXY: ""
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ""
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_PARAMETERS: ""
          GIT_CURL_VERBOSE: ""
          GIT_DIR: ""
          GIT_INDEX_FILE: ""
          GIT_OBJECT_DIRECTORY: ""
          GIT_PROXY_COMMAND: ""
          GIT_SSH: ""
          GIT_SSH_COMMAND: ""
          GIT_SSL_NO_VERIFY: ""
          GIT_TRACE: ""
          GIT_TRACE2: ""
          GIT_TRACE2_EVENT: ""
          GIT_TRACE_CURL: ""
          GIT_TRACE_PACKET: ""
          GIT_WORK_TREE: ""
          HTTPS_PROXY: ""
          HTTP_PROXY: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          NO_PROXY: ""
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          PUBLISH_BRANCH_RELEASE: ${{ vars.BRANCH_RELEASE || 'FrogPilot' }}
          PUBLISH_BRANCH_STAGING: ${{ vars.BRANCH_STAGING || 'FrogPilot-Staging' }}
          PUBLISH_BRANCH_TESTING: ${{ vars.BRANCH_TESTING || 'FrogPilot-Testing' }}
          PUBLISH_BUNDLE_DIR: /tmp/compiled-frogpilot
          PUBLISH_CUSTOM_BRANCH: ${{ inputs.publish_custom_branch }}
          PUBLISH_REF_NAME: ${{ github.ref_name }}
          TMPDIR: /tmp
          WORKFLOW_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          unset \
            ALL_PROXY \
            GIT_ALTERNATE_OBJECT_DIRECTORIES \
            GIT_CONFIG_PARAMETERS \
            GIT_CURL_VERBOSE \
            GIT_DIR \
            GIT_INDEX_FILE \
            GIT_OBJECT_DIRECTORY \
            GIT_PROXY_COMMAND \
            GIT_SSH \
            GIT_SSH_COMMAND \
            GIT_SSL_NO_VERIFY \
            GIT_TRACE \
            GIT_TRACE2 \
            GIT_TRACE2_EVENT \
            GIT_TRACE_CURL \
            GIT_TRACE_PACKET \
            GIT_WORK_TREE \
            HTTPS_PROXY \
            HTTP_PROXY \
            LD_AUDIT \
            LD_LIBRARY_PATH \
            LD_PRELOAD \
            NO_PROXY \
            BRANCH_RELEASE \
            BRANCH_STAGING \
            BRANCH_TESTING \
            BUILD_DIR \
            INPUT_CUSTOM_BRANCH \
            all_proxy \
            https_proxy \
            http_proxy \
            no_proxy
          while IFS= read -r name; do
            case "$name" in
              GIT_CONFIG_KEY_*|GIT_CONFIG_VALUE_*) unset "$name" ;;
            esac
          done < <(compgen -e)
          export GIT_CONFIG_COUNT=0
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export TMPDIR=/tmp

          bundle_dir="$PUBLISH_BUNDLE_DIR"
          bundle="$bundle_dir/compiled_frogpilot.bundle"
          head_file="$bundle_dir/compiled_frogpilot.head"
          branch_release="$PUBLISH_BRANCH_RELEASE"
          branch_staging="$PUBLISH_BRANCH_STAGING"
          branch_testing="$PUBLISH_BRANCH_TESTING"
          input_custom_branch="$PUBLISH_CUSTOM_BRANCH"
          ref_name="$PUBLISH_REF_NAME"

          if [[ ! -s "$bundle" || ! -s "$head_file" ]]; then
            echo "Compiled bundle artifact is missing or empty."
            exit 1
          fi

          repo_dir=$(mktemp -d)
          git_home=$(mktemp -d)
          trap 'rm -rf "$repo_dir" "$git_home"; rm -f "${askpass:-}" "${token_file:-}"; unset TOKEN_FILE WORKFLOW_TOKEN' EXIT
          git_local=(
            env -i
            HOME="$git_home"
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            GIT_CONFIG_GLOBAL=/dev/null
            GIT_CONFIG_NOSYSTEM=1
            git
            -c core.hooksPath=/dev/null
            -c credential.helper=
          )
          "${git_local[@]}" bundle verify "$bundle"
          "${git_local[@]}" clone "$bundle" "$repo_dir"
          cd "$repo_dir"

          expected_head=$(tr -d '[:space:]' < "$head_file")
          actual_head=$("${git_local[@]}" rev-parse HEAD)
          if [[ "$actual_head" != "$expected_head" ]]; then
            echo "Bundle HEAD mismatch: expected $expected_head, got $actual_head."
            exit 1
          fi

          for target in "$ref_name" "$branch_release" "$branch_staging" "$branch_testing"; do
            "${git_local[@]}" check-ref-format --branch "$target" >/dev/null
          done
          if [[ -n "$input_custom_branch" ]]; then
            "${git_local[@]}" check-ref-format --branch "$input_custom_branch" >/dev/null
          fi

          rm -f .git/config
          rm -rf .git/hooks
          mkdir -p .git/hooks
          "${git_local[@]}" config --local user.name "${{ vars.GIT_NAME }}"
          "${git_local[@]}" config --local user.email "${{ vars.GIT_EMAIL }}"
          "${git_local[@]}" remote add origin "https://github.com/${{ github.repository }}.git"

          token_file=$(mktemp)
          chmod 600 "$token_file"
          printf '%s' "$WORKFLOW_TOKEN" > "$token_file"
          unset WORKFLOW_TOKEN

          askpass=$(mktemp)
          chmod 700 "$askpass"
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) cat "$TOKEN_FILE" ;;
            *) printf '\n' ;;
          esac
          EOF
          git_safe=(
            env -i
            HOME="$git_home"
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            GIT_ASKPASS="$askpass"
            GIT_CONFIG_GLOBAL=/dev/null
            GIT_CONFIG_NOSYSTEM=1
            GIT_TERMINAL_PROMPT=0
            TOKEN_FILE="$token_file"
            git
            -c core.hooksPath=/dev/null
            -c credential.helper=
          )

          targets=("$ref_name")
          if [[ "${{ inputs.publish_frogpilot }}" == "true" ]]; then
            targets+=("$branch_release")
          fi
          if [[ "${{ inputs.publish_staging }}" == "true" ]]; then
            targets+=("$branch_staging")
          fi
          if [[ "${{ inputs.publish_testing }}" == "true" ]]; then
            targets+=("$branch_testing")
          fi
          if [[ -n "$input_custom_branch" ]]; then
            targets+=("$input_custom_branch")
          fi

          for target in "${targets[@]}"; do
            echo "[-] pushing $target T=$SECONDS"
            if expected_ref=$("${git_safe[@]}" ls-remote --exit-code --heads origin "$target" 2>/dev/null | awk '{print $1}'); then
              "${git_safe[@]}" push --no-verify \
                --force-with-lease="refs/heads/$target:$expected_ref" \
                origin "HEAD:refs/heads/$target"
            else
              "${git_safe[@]}" push --no-verify origin "HEAD:refs/heads/$target"
            fi
          done

          echo "[-] done T=$SECONDS"
