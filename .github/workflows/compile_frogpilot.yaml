name: Compile FrogPilot
run-name: >-
  Compile ${{ inputs.publish_custom_branch ||
    inputs.publish_frogpilot && 'FrogPilot' ||
    inputs.publish_staging && 'FrogPilot-Staging' ||
    inputs.publish_testing && 'FrogPilot-Testing' ||
    inputs.source_branch != 'Custom' && inputs.source_branch || inputs.custom_source_branch }}

on:
  workflow_dispatch:
    inputs:
      not_vetted:
        description: This branch is not vetted
        type: boolean
      source_branch:
        default: FrogPilot-Vetting
        description: Source branch
        options:
          - FrogPilot-Vetting
          - Custom
        type: choice
      custom_source_branch:
        description: Custom source branch
        type: string
      publish_frogpilot:
        description: Push to FrogPilot
        type: boolean
      publish_staging:
        description: Push to FrogPilot-Staging
        type: boolean
      publish_testing:
        description: Push to FrogPilot-Testing
        type: boolean
      publish_custom_branch:
        description: Custom target branch
        type: string
      runner:
        default: c3
        description: Select runner
        options: [c3, c3x]
        type: choice

env:
  BUILD_DIR: /data/openpilot

  GIT_EMAIL: ${{ vars.GIT_EMAIL }}
  GIT_NAME: ${{ vars.GIT_NAME }}

  BRANCH_RELEASE: ${{ vars.BRANCH_RELEASE }}
  BRANCH_STAGING: ${{ vars.BRANCH_STAGING }}
  BRANCH_TESTING: ${{ vars.BRANCH_TESTING }}
  CUSTOM_BRANCH: ${{ inputs.publish_custom_branch }}
  SOURCE_BRANCH: ${{ inputs.source_branch != 'Custom' && inputs.source_branch || inputs.custom_source_branch }}

  COMPILE_COMMIT: ${{ vars.COMPILE_COMMIT }}

permissions: {}

concurrency: compile-frogpilot

jobs:
  build_and_push:
    name: Compile FrogPilot
    concurrency:
      group: frogpilot-branch-push
      queue: max
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 180
    defaults: {run: {shell: bash}}
    steps:
      - name: Build release
        run: |
          : "${COMPILE_COMMIT:?COMPILE_COMMIT is required}" "${GIT_NAME:?GIT_NAME is required}" "${GIT_EMAIL:?GIT_EMAIL is required}"

          sudo rm -rf "$BUILD_DIR" /data/scons_cache

          git clone --filter=blob:none --no-checkout --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$BUILD_DIR"

          cd "$BUILD_DIR"

          targets=("$SOURCE_BRANCH")
          ${{ inputs.publish_frogpilot }} && targets+=("$BRANCH_RELEASE")
          ${{ inputs.publish_staging }} && targets+=("$BRANCH_STAGING")
          ${{ inputs.publish_testing }} && targets+=("$BRANCH_TESTING")
          [[ -n "$CUSTOM_BRANCH" ]] && targets+=("$CUSTOM_BRANCH")

          for target in "${targets[@]}"; do
            if [[ -z "$target" || "$(git check-ref-format --branch "$target")" != "$target" ]]; then
              echo "Invalid branch name: $target" >&2
              exit 1
            fi
            printf '%s\t%s\n' "$target" "$(git rev-parse --verify --quiet "refs/remotes/origin/$target")"
          done | sort -u > "$RUNNER_TEMP/targets"

          git checkout -B "$SOURCE_BRANCH" "refs/remotes/origin/$SOURCE_BRANCH"

          if [[ "$GITHUB_REF" == "refs/heads/$SOURCE_BRANCH" && "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "$SOURCE_BRANCH moved since dispatch; dispatch again."
            exit 1
          fi

          if [[ ! -f release/prepare_release.py ]]; then
            echo "No release/prepare_release.py; source branch already compiled?"
            exit 1
          fi

          source /etc/profile
          unset CERT DEBUG ENABLE_SPI FINAL_PROVISIONING H723 RELEASE USBGPU
          export PYTHONPATH="$BUILD_DIR"

          scons -j"$(nproc)" --minimal || scons -j1 --minimal
          python3 -B release/prepare_release.py "$BUILD_DIR"

          if [[ " ${targets[*]} " == *" $BRANCH_STAGING "* ]]; then
            git show "refs/remotes/origin/$BRANCH_STAGING:.github/update_date" > .github/update_date 2>/dev/null || rm -f .github/update_date
          fi

          if ${{ inputs.not_vetted }}; then
            touch not_vetted
          fi
          git add --all --force
          git -c user.name="$GIT_NAME" -c user.email="$GIT_EMAIL" \
            commit -m "$COMPILE_COMMIT"

      - name: Publish release
        env:
          WORKFLOW_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          leases=()
          refspecs=()
          while IFS=$'\t' read -r target expected_ref; do
            leases+=("--force-with-lease=refs/heads/$target:$expected_ref")
            refspecs+=("HEAD:refs/heads/$target")
          done < "$RUNNER_TEMP/targets"

          git -C "$BUILD_DIR" \
            -c credential.helper= \
            -c "credential.helper=!f() { printf 'username=x-access-token\npassword=%s\n' \"\$WORKFLOW_TOKEN\"; }; f" \
            -c remote.origin.pushurl="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            push --atomic "${leases[@]}" origin "${refspecs[@]}"

          awk -F'\t' 'BEGIN { print "### Published" } { print "- `" $1 "`" }' \
            "$RUNNER_TEMP/targets" >> "$GITHUB_STEP_SUMMARY"
