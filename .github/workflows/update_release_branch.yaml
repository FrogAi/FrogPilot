name: Update FrogPilot Branch
run-name: Check scheduled FrogPilot release

on:
  schedule:
    - cron: "0 11 * * *"

permissions: {contents: write}

env:
  GIT_EMAIL: ${{ vars.GIT_EMAIL }}
  GIT_NAME: ${{ vars.GIT_NAME }}

  BRANCH_PREVIOUS: ${{ vars.BRANCH_PREVIOUS }}
  BRANCH_RELEASE: ${{ vars.BRANCH_RELEASE }}
  BRANCH_STAGING: ${{ vars.BRANCH_STAGING }}

  BASE_COMMIT: ${{ vars.BASE_COMMIT }}

  TZ: UTC

jobs:
  update_release:
    name: Promote scheduled staging release
    concurrency:
      group: frogpilot-branch-push
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/heads/${{ env.BRANCH_STAGING }}
          sparse-checkout: |
            .github
            common

      - name: Promote scheduled staging release
        shell: bash
        run: |
          if [[ ! -f .github/update_date ]]; then
            echo "No scheduled release."
            exit 0
          fi

          scheduled_date="$(<.github/update_date)"
          today="$(date +%F)"

          if [[ "$(date -d "$scheduled_date" +%F 2>/dev/null)" != "$scheduled_date" ]]; then
            echo "Invalid scheduled date: $scheduled_date"
            exit 1
          fi

          if [[ "$scheduled_date" > "$today" ]]; then
            echo "Release scheduled for $scheduled_date."
            exit 0
          fi

          if [[ "$scheduled_date" < "$today" ]]; then
            echo "Scheduled for $scheduled_date; publishing as $today."
          fi

          read -r month day year < <(date -d "$today" '+%B %-d %Y')
          case "$day" in
            1|21|31) suffix=st ;;
            2|22) suffix=nd ;;
            3|23) suffix=rd ;;
            *) suffix=th ;;
          esac

          badge_date="${month}%20${day}${suffix}%2C%20${year}"
          sed -i -E "s|(Last%20Updated-)[^-)]*|\1$badge_date|g" README.md
          git rm .github/update_date
          git add README.md

          : "${BASE_COMMIT:?BASE_COMMIT is required}"
          layer_base="$(
            git log --reverse --format='%H %s' |
              awk '!found && $0 == $1 " " ENVIRON["BASE_COMMIT"] { print $1; found = 1 }'
          )"

          if [[ -z "$layer_base" ]]; then
            echo "No \"$BASE_COMMIT\" commit found; cannot squash."
            exit 1
          fi

          release_timestamp="$(date -d "$today 12:00:00" --iso-8601=seconds)"
          export GIT_AUTHOR_DATE="$release_timestamp" GIT_COMMITTER_DATE="$release_timestamp"

          git config user.name "$GIT_NAME"
          git config user.email "${GIT_EMAIL:?GIT_EMAIL is required}"

          squashed="$(git commit-tree "$(git rev-parse 'HEAD~1^{tree}')" -p "$layer_base^" \
            -m "FrogPilot v$(cut -d'"' -f2 common/version.h) release")"
          release="$(git commit-tree "$(git write-tree)" -p "$squashed" -m "$(git log -1 --format=%s HEAD)")"

          delay=$(( $(date -d "$release_timestamp" +%s) - $(date +%s) ))
          if (( delay > 0 )); then
            sleep "$delay"
          fi

          git push --atomic --force-with-lease origin \
            "refs/remotes/origin/$BRANCH_RELEASE:refs/heads/$BRANCH_PREVIOUS" \
            "$release:refs/heads/$BRANCH_RELEASE" \
            "$release:refs/heads/$BRANCH_STAGING"
