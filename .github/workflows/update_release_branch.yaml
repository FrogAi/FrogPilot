name: Update FrogPilot Branch
run-name: Check scheduled FrogPilot release

on:
  schedule:
    - cron: "0 11 * * *"

permissions: {}

env:
  GIT_EMAIL: ${{ vars.GIT_EMAIL }}
  GIT_NAME: ${{ vars.GIT_NAME }}

  BRANCH_PREVIOUS: ${{ vars.BRANCH_PREVIOUS }}
  BRANCH_RELEASE: ${{ vars.BRANCH_RELEASE }}
  BRANCH_STAGING: ${{ vars.BRANCH_STAGING }}

  BASE_COMMIT: ${{ vars.BASE_COMMIT }}

  TZ: UTC

jobs:
  update_release:
    if: github.repository == 'FrogAi/FrogPilot'
    name: Promote scheduled staging release
    concurrency:
      group: frogpilot-branch-push
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          ref: refs/heads/${{ env.BRANCH_STAGING }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Promote scheduled staging release
        run: |
          if [[ ! -f .github/update_date ]]; then
            echo "No scheduled release."
            exit 0
          fi

          scheduled_date="$(<.github/update_date)"
          today="$(date +%F)"

          if [[ "$scheduled_date" > "$today" ]]; then
            echo "Release scheduled for $scheduled_date."
            exit 0
          fi

          read -r month day year < <(date -d "$today" '+%B %-d %Y')
          case "$day" in
            1|21|31) suffix=st ;;
            2|22) suffix=nd ;;
            3|23) suffix=rd ;;
            *) suffix=th ;;
          esac

          sed -i "s/Last%20Updated-[^-]*/Last%20Updated-$month%20$day$suffix%2C%20$year/" README.md
          git rm .github/update_date
          git add README.md

          release_timestamp="$today 12:00:00"
          export GIT_AUTHOR_DATE="$release_timestamp"
          export GIT_COMMITTER_DATE="$release_timestamp"
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"

          layer_base="$(git log --format=%H --grep="^$BASE_COMMIT\$")"
          squashed="$(git commit-tree 'HEAD~1^{tree}' -p "$layer_base^" -m "FrogPilot v$(cut -d'"' -f2 common/version.h) release")"
          release="$(git commit-tree "$(git write-tree)" -p "$squashed" -m "$(git log -1 --format=%s HEAD)")"

          delay=$(( $(date -d "$release_timestamp" +%s) - $(date +%s) ))
          if (( delay > 0 )); then
            sleep "$delay"
          fi

          git push --atomic --force-with-lease origin \
            "refs/remotes/origin/$BRANCH_RELEASE:refs/heads/$BRANCH_PREVIOUS" \
            "$release:refs/heads/$BRANCH_RELEASE" \
            "$release:refs/heads/$BRANCH_STAGING"
