name: Schedule FrogPilot Update
run-name: Schedule FrogPilot update for ${{ inputs.scheduled_date }}

on:
  workflow_dispatch:
    inputs:
      scheduled_date:
        description: Enter the date to update the FrogPilot branch (YYYY-MM-DD)
        required: true
        type: string

permissions: {contents: write}

env:
  GIT_EMAIL: ${{ vars.GIT_EMAIL }}
  GIT_NAME: ${{ vars.GIT_NAME }}

  BRANCH_STAGING: ${{ vars.BRANCH_STAGING }}

  SCHEDULED_DATE: ${{ inputs.scheduled_date }}

  TZ: UTC

concurrency: schedule-frogpilot-update

jobs:
  schedule_update:
    name: Schedule staging release handoff
    concurrency:
      group: frogpilot-branch-push
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: refs/heads/${{ env.BRANCH_STAGING }}

      - name: Schedule staging release handoff
        run: |
          if [[ "$(date -d "$SCHEDULED_DATE" +%F 2>/dev/null)" != "$SCHEDULED_DATE" ||
                "$SCHEDULED_DATE" < "$(date +%F)" ]]; then
            echo "scheduled_date must be a valid date in YYYY-MM-DD format, today or later in $TZ."
            exit 1
          fi

          printf '%s\n' "$SCHEDULED_DATE" > .github/update_date
          git add .github/update_date

          if git diff --cached --quiet; then
            echo "No schedule change detected."
            exit 0
          fi

          GIT_COMMITTER_DATE="$(git log -1 --format=%cI)" \
            git -c user.name="$GIT_NAME" -c user.email="${GIT_EMAIL:?GIT_EMAIL is required}" commit --amend --no-edit

          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH_STAGING"
