name: Update PR Branch
run-name: Update ${{ vars.BRANCH_PR_TARGET }}

on:
  push:
    branches: [FrogPilot-Testing]
  workflow_dispatch:

permissions: {contents: write}

env:
  GIT_EMAIL: ${{ vars.GIT_EMAIL }}
  GIT_NAME: ${{ vars.GIT_NAME }}

  BRANCH_PR_TARGET: ${{ vars.BRANCH_PR_TARGET }}

  COMPILE_COMMIT: ${{ vars.COMPILE_COMMIT }}

  TZ: UTC

concurrency: update-pr-branch

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          ref: refs/heads/FrogPilot-Testing
      - run: |
          set -o pipefail

          if [[ "$BRANCH_PR_TARGET" == FrogPilot-Testing ]]; then
            echo "BRANCH_PR_TARGET must differ from FrogPilot-Testing." >&2
            exit 1
          fi

          target_ref="refs/remotes/origin/$BRANCH_PR_TARGET"

          compile_commit="$(
            git log --first-parent --format='%H%x09%s' |
              awk -F '\t' -v want="${COMPILE_COMMIT:?COMPILE_COMMIT is required}" '!found && $2 == want { print $1; found=1 }'
          )"
          if [[ -f prebuilt ]]; then
            if [[ -z "$compile_commit" ]]; then
              echo "Compiled tree but no \"$COMPILE_COMMIT\" commit found." >&2
              exit 1
            fi
            git revert --no-commit "$compile_commit"
          fi

          tree="$(git write-tree)"
          if [[ "$tree" == "$(git rev-parse "$target_ref^{tree}")" ]]; then
            echo "$BRANCH_PR_TARGET is already up to date."
            exit 0
          fi

          read -r month day year < <(date '+%B %-d %Y')
          case "$day" in
            1|21|31) suffix="st" ;;
            2|22) suffix="nd" ;;
            3|23) suffix="rd" ;;
            *) suffix="th" ;;
          esac

          message="$month ${day}${suffix}, $year Update"
          parent="$target_ref"
          if [[ "$(git log -1 --format=%s "$target_ref")" == "$message" ]]; then
            parent="$target_ref^"
          fi

          commit="$(
            git -c user.name="$GIT_NAME" -c user.email="${GIT_EMAIL:?GIT_EMAIL is required}" \
              commit-tree "$tree" -p "$parent" -m "$message"
          )"

          git push --force-with-lease origin "$commit:refs/heads/$BRANCH_PR_TARGET"
